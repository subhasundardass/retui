version: "2"

# Curated, correctness-first linter set. Starts conservative on purpose —
# style-heavy linters (revive, gocritic, wsl, etc.) are left off for now so
# the first CI run doesn't drown in pre-existing findings. Tighten this over
# time by moving linters from the commented-out list below into `enable`.
linters:
  default: none
  enable:
    - errcheck    # unchecked error return values
    - govet       # suspicious constructs (already run separately in ci.yml,
                   # kept here too so `golangci-lint run` alone is complete)
    - staticcheck # bugs, simplifications, deprecated API usage
                   # (subsumes the old gosimple/stylecheck linters in v2)
    - unused      # unused consts, vars, funcs, types
    - ineffassign # assignments that are immediately overwritten
    - misspell    # typos in comments/strings
    - unconvert   # unnecessary type conversions

  settings:
    errcheck:
      # Reduce noise from the common, low-risk pattern of ignoring an
      # already-deferred Close()/Flush() error. Tighten later if desired.
      check-blank: false
      check-type-assertions: false

  exclusions:
    rules:
      # Test files routinely ignore errors on setup/teardown calls; don't
      # fail CI over that pattern.
      - path: _test\.go
        linters:
          - errcheck

  # Linters to consider enabling once the codebase has been swept once:
  #   - revive          (style/idiom — successor to the deprecated golint)
  #   - gocritic        (broader style + minor bug patterns)
  #   - gocyclo          (flags overly complex functions)
  #   - bodyclose        (unclosed HTTP response bodies — n/a until networking is added)

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m