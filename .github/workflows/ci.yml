name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.2", "1.26.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build (native)
        run: go build ./retui/...

      - name: Build (windows cross-compile)
        run: GOOS=windows GOARCH=amd64 go build ./retui/...

      - name: Build (darwin cross-compile)
        run: GOOS=darwin GOARCH=arm64 go build ./retui/...

      - name: Vet
        run: go vet ./retui/...

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l ./retui)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          # Find only packages that actually have _test.go files
          TEST_PKGS=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./retui/... | tr '\n' ' ')
          
          if [ -z "$TEST_PKGS" ]; then
            echo "⚠️  No test files found in ./retui/..."
            exit 1
          fi
          
          echo "📋 Testing packages: $TEST_PKGS"
          go test $TEST_PKGS -v -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./retui/...

      - name: Display coverage summary
        run: |
          echo "📊 Coverage Summary:"
          go tool cover -func=coverage.out | tail -1

      - name: Generate HTML coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.go-version }}
          path: |
            coverage.out
            coverage.html

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.go-version }}
          path: |
            coverage.out
            *.test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./retui/...

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: vuln-report.json