name: Go CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.26.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go version
        run: go version

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: |
          go build ./retui/...

      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./retui/...

      - name: Build macOS
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build ./retui/...

      - name: Vet
        run: |
          go vet ./retui/...

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l ./retui)"

          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

          echo "All Go files are properly formatted."

      - name: Run tests
        run: |
          go test ./retui/... \
            -v \
            -race \
            -covermode=atomic \
            -coverprofile=coverage.out \
            -coverpkg=./retui/...

      - name: Display coverage summary
        run: |
          echo "Coverage Summary:"
          go tool cover -func=coverage.out | tail -1

      - name: Generate HTML coverage report
        run: |
          go tool cover \
            -html=coverage.out \
            -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-go-${{ matrix.go-version }}
          path: |
            coverage.out
            *.test
          if-no-files-found: ignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./retui/...
